# Windows PC しか無くても iOS アプリをビルドするための仕組み。
# GitHub が貸してくれる Mac の上で XcodeGen + xcodebuild を回し、
# 署名なしの .ipa を成果物として置いて帰る。手元に Mac は要らない。
#
# 署名は Windows 側で Sideloadly が Apple ID を使って行う（無料アカウントなら7日で失効）。
name: build-ipa

on:
  push:
  workflow_dispatch:      # GitHub の画面のボタンから手動でも回せる

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ★Macには複数のXcodeが入っていて、既定で選ばれるのが古い方のことがある。
      #   XcodeGen(2.46)が書くプロジェクト形式(objectVersion 77)は Xcode 16 以降でないと読めず、
      #   Xcode 15.4 だと「future Xcode project file format (77)」で止まる。2026-09-10に踏んだ。
      #   入っているXcodeを全部出したうえで、一番新しいものを選ぶ。
      - name: 新しい方の Xcode を選ぶ
        run: |
          echo "--- 入っている Xcode ---"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "--- 使う Xcode ---"
          xcodebuild -version

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: project.yml から .xcodeproj を生成
        run: xcodegen generate

      # 何が作られたかを必ず記録に残す。スキームが無いと次の手順が3秒で落ちるので、
      # そのときこの出力を見れば一発で分かる。
      - name: 中身を確認（ターゲットとスキームの一覧）
        run: xcodebuild -list -project GaitCam.xcodeproj

      - name: 署名なしでビルド
        run: |
          xcodebuild \
            -project GaitCam.xcodeproj \
            -scheme GaitCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: .ipa の形に詰める
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GaitCam.app Payload/
          zip -qry GaitCam.ipa Payload

      - name: 成果物として置く
        uses: actions/upload-artifact@v4
        with:
          name: GaitCam-unsigned-ipa
          path: GaitCam.ipa
